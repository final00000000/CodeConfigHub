<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeConfigHub</title>
  <link rel="stylesheet" href="./index.css" />
</head>

<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>

    <main class="workspace">
      <header class="workspace-topbar">
        <div class="workspace-heading">
          <p class="workspace-kicker">桌面配置工具</p>
          <h1 id="workspace-title">配置发现与可视化编辑</h1>
          <p id="workspace-subtitle">自动扫描 Codex CLI 与 Claude Code 配置，并在保存前实时生成代码预览。</p>
        </div>

        <div class="workspace-actions">
          <button id="theme-btn" class="icon-button" type="button" title="切换主题">🌞</button>
          <button id="choose-project-btn" class="ghost-button" type="button">选择项目目录</button>
          <button id="rescan-btn" class="ghost-button" type="button">重新扫描</button>
          <button id="reveal-btn" class="ghost-button" type="button">定位文件</button>
          <button id="save-btn" class="primary-button" type="button">保存当前文件</button>
        </div>
      </header>

      <section id="workspace-panels" class="workspace-panels">
        <div id="editor-panel" class="panel panel--editor"></div>
        <button id="panel-splitter" class="panel-splitter" type="button" aria-label="调整编辑与预览面板宽度"></button>
        <div id="preview-panel" class="panel panel--preview"></div>
      </section>
    </main>

    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
    <div id="update-modal-root" class="modal-root"></div>
  </div>

  <script type="module" src="./renderer.js"></script>
</body>

</html>

name: build-mac-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag，例如 v0.4.7
        required: true
        type: string
      upload_to_release:
        description: 是否自动上传到对应 Release
        required: true
        default: true
        type: boolean

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --universal --publish never --config.directories.output=dist-mac

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mac-release-${{ inputs.tag }}
          if-no-files-found: error
          path: |
            dist-mac/*.dmg
            dist-mac/*.zip
            dist-mac/*.yml
            dist-mac/*.blockmap

      - name: Validate manual release notes
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "Release ${{ inputs.tag }} 不存在。请先手动创建 Release，并使用 release-notes/${{ inputs.tag }}.md 填写完整更新日志。"
            exit 1
          fi

          body="$(gh release view "${{ inputs.tag }}" --json body --jq .body)"
          body="$(printf '%s' "$body" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$body" ]; then
            echo "Release ${{ inputs.tag }} 说明为空。请使用完整更新日志，不要留空。"
            exit 1
          fi

          if printf '%s' "$body" | grep -Eq '^\*\*Full Changelog\*\*:[[:space:]]*https://github\.com/.+/compare/.+\.\.\..+$'; then
            echo "Release ${{ inputs.tag }} 当前仍是自动生成说明（只有 Full Changelog 对比链接）。请改成完整人工更新日志后再发布。"
            exit 1
          fi

      - name: Upload assets to GitHub Release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist-mac/*.dmg dist-mac/*.zip dist-mac/*.yml dist-mac/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS artifacts found."
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber

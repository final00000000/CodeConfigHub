name: build-mac-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag，例如 v0.4.7
        required: true
        type: string
      upload_to_release:
        description: 是否自动上传到对应 Release
        required: true
        default: true
        type: boolean

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned macOS artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg zip --universal --publish never --config.directories.output=dist-mac

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-${{ inputs.tag }}
          if-no-files-found: error
          path: |
            dist-mac/*.dmg
            dist-mac/*.zip
            dist-mac/*.yml
            dist-mac/*.blockmap

      - name: Upload assets to GitHub Release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist-mac/*.dmg dist-mac/*.zip dist-mac/*.yml dist-mac/*.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS artifacts found."
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber
